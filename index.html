<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Basic Calculator</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 20px;
			background: #eef2f7;
			color: #172033;
			font-family: Arial, sans-serif;
		}
		.calculator {
			width: min(100%, 340px);
			padding: 22px;
			border-radius: 18px;
			background: #fff;
			box-shadow: 0 12px 35px #19284420;
		}
		h1 { margin: 0 0 16px; font-size: 1.25rem; }
		#display {
			width: 100%;
			height: 74px;
			margin-bottom: 14px;
			padding: 12px;
			border: 1px solid #d9e0ea;
			border-radius: 10px;
			background: #f8fafc;
			color: inherit;
			font-size: 2rem;
			text-align: right;
		}
		.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
		button {
			min-height: 58px;
			border: 0;
			border-radius: 10px;
			background: #edf1f6;
			color: inherit;
			font-size: 1.15rem;
			cursor: pointer;
		}
		button:hover { background: #dfe6ef; }
		button:focus-visible { outline: 3px solid #7ba8ff; outline-offset: 2px; }
		.operator { background: #e5edff; color: #2459c4; }
		.clear { background: #ffe8e7; color: #b53630; }
		.equals { grid-row: span 2; background: #315fce; color: white; }
		.zero { grid-column: span 2; }
	</style>
</head>
<body>
	<main class="calculator" aria-label="Basic calculator">
		<h1>Basic Calculator</h1>
		<input id="display" type="text" value="0" aria-label="Calculator display" readonly>
		<div class="keys">
			<button class="clear" data-action="clear">AC</button>
			<button class="operator" data-action="delete" aria-label="Delete last digit">DEL</button>
			<button class="operator" data-value="/">÷</button>
			<button class="operator" data-value="*">×</button>
			<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
			<button class="operator" data-value="-">−</button>
			<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
			<button class="operator" data-value="+">+</button>
			<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
			<button class="equals" data-action="equals">=</button>
			<button class="zero" data-value="0">0</button><button data-value=".">.</button>
		</div>
	</main>
	<script>
		const display = document.getElementById('display');
		let expression = '';

		function render() {
			display.value = expression.replace(/\*/g, '×').replace(/\//g, '÷') || '0';
		}

		function addValue(value) {
			const operators = '+-*/';
			const last = expression.slice(-1);
			if (value === '.') {
				const currentNumber = expression.split(/[+\-*/]/).pop();
				if (currentNumber.includes('.')) return;
				if (!currentNumber) expression += '0';
			}
			if (operators.includes(value)) {
				if (!expression && value !== '-') return;
				if (operators.includes(last)) expression = expression.slice(0, -1);
			}
			expression += value;
			render();
		}

		function calculate() {
			if (!expression || /[+\-*/.]$/.test(expression)) return;
			try {
				const result = Function('"use strict"; return (' + expression + ')')();
				expression = Number.isFinite(result) ? String(Number(result.toPrecision(12))) : 'Error';
			} catch {
				expression = 'Error';
			}
			render();
		}

		document.querySelector('.keys').addEventListener('click', (event) => {
			const button = event.target.closest('button');
			if (!button) return;
			if (button.dataset.action === 'clear') expression = '';
			else if (button.dataset.action === 'delete') expression = expression.slice(0, -1);
			else if (button.dataset.action === 'equals') return calculate();
			else addValue(button.dataset.value);
			render();
		});

		document.addEventListener('keydown', (event) => {
			if (/^[0-9.+\-*/]$/.test(event.key)) addValue(event.key);
			else if (event.key === 'Enter' || event.key === '=') calculate();
			else if (event.key === 'Backspace') { expression = expression.slice(0, -1); render(); }
			else if (event.key === 'Escape') { expression = ''; render(); }
		});
	</script>
</body>
</html>
